/ur7e_nvblox:
  ros__parameters:
    use_sim_time: true
    world_frame: base_link
    depth_topic: /camera/depth/image_rect_raw
    camera_info_topic: /camera/depth/camera_info
    depth_frame: camera_depth_optical_frame
    depth_stride: 2
    min_depth_m: 0.2
    max_depth_m: 3.0
    voxel_size_m: 0.025
    tf_timeout_sec: 0.15
    max_frame_age_sec: 1.5
    esdf_hz: 10.0
    free_space_backend: cuda
    free_space_update_hz: 5.0
    grid_resolution_m: 0.03
    grid_size_m: [1.8, 1.8, 1.5]
    grid_center_m: [0.0, 0.0, 0.6]
    # Only valid after commissioning the specified static scene's initial pose.
    # This is a bounded initial free-space prior, never a global unknown=free policy.
    initial_clearance_m: 0.12
    max_visualized_distance_m: 0.06
/perception_planner:
  ros__parameters:
    use_sim_time: true
    max_joint_speed: 0.08
    planning_dt: 0.1
    servo_hz: 50.0
    particles: 128
    collision_margin: 0.015
    map_timeout_wall: 3.0
    map_timeout_sim: 1.5
    joint_timeout_wall: 0.5
    command_timeout_wall: 1.5
    autostart: true
    goal_offset: [-0.02, -0.03, 0.0]
