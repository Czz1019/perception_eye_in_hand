/**:
  ros__parameters:
    use_sim_time: true
    world_frame: base_link
    depth_topic: /esdf_input/depth
    camera_info_topic: /esdf_input/camera_info
    depth_frame: camera_depth_optical_frame
    depth_stride: 1
    min_depth_m: 0.2
    max_depth_m: 4.0
    voxel_size_m: 0.03
    tf_timeout_sec: 0.15
    max_frame_age_sec: 0.5
    esdf_hz: 30.0
    publish_hz: 30.0
    esdf_output_mode: native
    grid_resolution_m: 0.05
    grid_size_m:
    - 2.0
    - 2.0
    - 1.5
    grid_center_m:
    - 0.0
    - 0.0
    - 0.5
    max_visualized_distance_m: 0.15
    full_grid_reliable: true
    output_directory: ~/nvblox_output/ur7e_sim
