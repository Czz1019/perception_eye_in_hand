/**:
  ros__parameters:
    use_sim_time: true
    world_frame: base_link
    depth_topic: /camera/depth/image_rect_raw
    camera_info_topic: /camera/depth/camera_info
    depth_frame: camera_depth_optical_frame
    depth_stride: 2
    min_depth_m: 0.2
    max_depth_m: 3.0
    voxel_size_m: 0.01
    tf_timeout_sec: 0.15
    max_frame_age_sec: 0.5
    mesh_hz: 1.0
    # Visualization/export ROI in base_link. The TSDF still integrates all valid depth.
    roi_min_m: [0.15, -0.65, -0.025]
    roi_max_m: [0.8, 0.65, 0.6]
    output_directory: ~/nvblox_output/ur7e_reconstruction
    color_topic: /camera/color/image_raw
    color_info_topic: /camera/color/camera_info
    color_frame: camera_color_optical_frame
    # Gazebo sensor pose is camera_link + (0, .015, 0), not the nominal housing optical origin.
    color_pose_frame: camera_sim_color_optical_frame
    sync_slop_sec: 0.035
    max_joint_velocity_rad_s: 0.025
