# D435 input specialization; robot optical frames come from calibrated URDF.
/**:
  ros__parameters:
    use_lidar: false
    input_qos: SENSOR_DATA
    use_tf_transforms: true
    use_topic_transforms: false
    static_mapper:
      esdf_slice_height: 0.0
      esdf_slice_min_height: -0.1
      esdf_slice_max_height: 0.3
