/**:
  ros__parameters:
    global_frame: base_link
    # Use reliable only when the image publisher offers reliable delivery.
    input_qos: sensor_data
    voxel_size: 0.005
    esdf_mode: 3d
    enable_depth: true
    enable_color: true
    enable_esdf: true
    enable_mesh: true
    enable_layers: true
    enable_esdf_view: true
    publish_path: true
    publish_esdf_distance_slice: true
    depth_hz: 40.0
    color_hz: 40.0
    esdf_hz: 33.4
    esdf_view_hz: 33.4
    esdf_view_stride: 2
    mesh_hz: 5.0
    layer_hz: 5.0
    decay_hz: 1.0
    clearing_hz: 1.0
    clearing_radius_m: -1.0
    esdf_view_mode: observed
    esdf_view_band_m: 0.24
    min_depth_m: 0.05
    max_range_m: 2.05
    truncation_vox: 4.0
    max_weight: 5.0
    weighting_mode: inverse_square_tsdf_distance_penalty
    invalid_depth_decay_factor: -1.0
    esdf_max_distance_m: 2.0
    esdf_min_weight: 0.1
    esdf_max_site_vox: 2.0
    mesh_min_weight: 0.1
    mesh_weld_vertices: true
    layer_min_weight: 0.1
    raycast_subsampling_factor: 4
    # Bound the laboratory map: 5 mm unbounded mapping can exhaust GPU memory.
    workspace_bounds_type: bounding_box
    workspace_min_x: -0.1
    workspace_max_x: 1.1
    workspace_min_y: -0.6
    workspace_max_y: 0.6
    workspace_min_z: -0.05
    workspace_max_z: 1.05
    tsdf_decay_factor: 0.95
    tsdf_decayed_weight_threshold: 0.001
    slice_min_height: 0.0
    slice_max_height: 0.8
    slice_height: 0.25
    depth_topic: /camera/depth/image_rect_raw
    depth_info_topic: /camera/depth/camera_info
    color_topic: /camera/color/image_raw
    color_info_topic: /camera/color/camera_info
    input_queue_size: 4
    max_input_age_sec: 0.5
    path_max_poses: 3000
    max_query_points: 200000
    service_timeout_sec: 20.0
    publish_pose: true
